CONFIG_ZTEST=y
# The motor thread runs every 1 ms; native_sim defaults to 100 ticks/s.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# Shell commands, run through the dummy backend (src/test_shell.c).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1024
