<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 245" width="700" height="245" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- SPDX-License-Identifier: MIT -->
  <title>PWM cycle timing and the one-period duty delay</title>
  <style>
    .bg { fill: #ffffff; } .fg { fill: #24292f; } .mut { fill: #57606a; }
    .car { stroke: #24292f; stroke-width: 1.5; fill: none; }
    .mk { stroke: #8c959f; stroke-dasharray: 3 3; }
    .isr { fill: #ddf4ff; stroke: #0969da; } .dk { fill: #dafbe1; stroke: #1a7f37; } .dk1 { fill: #f6f8fa; stroke: #8c959f; }
    .arr { stroke: #0969da; stroke-width: 1.4; fill: none; } .ah { fill: #0969da; }
    .obs { stroke: #bf8700; stroke-width: 1.4; fill: none; } .aho { fill: #bf8700; } .obst { fill: #9a6700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .fg { fill: #e6edf3; } .mut { fill: #8b949e; }
      .car { stroke: #e6edf3; } .mk { stroke: #6e7681; }
      .isr { fill: #0c2d6b; stroke: #4493f8; } .dk { fill: #04260f; stroke: #3fb950; } .dk1 { fill: #161b22; stroke: #6e7681; }
      .arr { stroke: #4493f8; } .ah { fill: #4493f8; }
      .obs { stroke: #d29922; } .aho { fill: #d29922; } .obst { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="aho" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" width="700" height="245"/>
  <text class="mut" x="10" y="20" font-size="11">timer counter (centre-aligned)</text>
  <!-- carrier: apex = centre of the low-side window = sample + update event -->
  <path class="car" d="M80 40 L170 110 L260 40 L350 110 L440 40 L530 110 L620 40"/>
  <g class="mk"><line x1="80" y1="30" x2="80" y2="200"/><line x1="260" y1="30" x2="260" y2="200"/><line x1="440" y1="30" x2="440" y2="200"/><line x1="620" y1="30" x2="620" y2="200"/></g>
  <text class="fg" x="80" y="125" text-anchor="middle" font-size="12">S/U k−1</text>
  <text class="fg" x="260" y="125" text-anchor="middle" font-size="12">S/U k</text>
  <text class="fg" x="440" y="125" text-anchor="middle" font-size="12">S/U k+1</text>
  <text class="fg" x="620" y="125" text-anchor="middle" font-size="12">S/U k+2</text>
  <!-- ISR after sample k -->
  <rect class="isr" x="264" y="135" width="100" height="22" rx="3"/>
  <text class="fg" x="314" y="151" text-anchor="middle" font-size="12">ISR k → d_k</text>
  <path class="arr" d="M364 146 H420 L436 160" marker-end="url(#a)"/>
  <text class="mut" x="392" y="140" text-anchor="middle" font-size="11">preload</text>
  <!-- applied duties -->
  <rect class="dk1" x="260" y="165" width="180" height="22"/>
  <text class="fg" x="350" y="181" text-anchor="middle" font-size="12">d_k−1 applied</text>
  <rect class="dk" x="440" y="165" width="180" height="22"/>
  <text class="fg" x="530" y="181" text-anchor="middle" font-size="12">d_k applied</text>
  <!-- observer at k+1 integrates interval k..k+1 with d_k-1 -->
  <path class="obs" d="M350 192 V212 H436" marker-end="url(#o)"/>
  <text class="obst" x="180" y="236" font-size="11">observer at k+1 uses d_k−1: the duty actually applied before the sample</text>
  <text class="mut" x="10" y="140" font-size="11">S = sample</text>
  <text class="mut" x="10" y="154" font-size="11">U = update</text>
</svg>
